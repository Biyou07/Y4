[workspace]
authors = ["Biyou-g5 <mohamed.ayoub.belhimer@ensia.edu.dz>"]
channels = ['https://prefix.dev/robostack-jazzy', 'conda-forge']
name = "ros_jazzy_pixi"
platforms = ['osx-arm64']
version = "0.1.0"

[tasks]
turtlesim = "ros2 run turtlesim turtlesim_node"
teleop = "ros2 run turtlesim turtle_teleop_key"
rqt = "rqt"
rviz = "rviz2"

[activation.env]
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"
ROS_DOMAIN_ID = "42"

[dependencies]
ros-jazzy-desktop = ">=0.11.0,<0.12"
colcon-common-extensions = ">=0.3.0,<0.4"
ros-jazzy-teleop-twist-keyboard = ">=2.4.1,<3"
ros-jazzy-plotjuggler-ros = ">=2.3.1,<3"
pyzmq = ">=27.3.0,<28"
cbor2 = ">=6.2.0.post2,<7"
