name: Sync Study Notes to NotebookLM

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '**.markdown'
      - '**.pdf'
      - '**.docx'
      - '**.pptx'
      - '**.txt'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.webp'
      - 'notebooks.json'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      sync_all:
        description: 'Force sync all course materials in the repository'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    name: Ingest Course Content to Gemini Notebooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install notebooklm-py

      - name: Restore NotebookLM Auth Profile
        env:
          NOTEBOOKLM_STORAGE_STATE: ${{ secrets.NOTEBOOKLM_STORAGE_STATE }}
        run: |
          if [ -z "$NOTEBOOKLM_STORAGE_STATE" ]; then
            echo "::error::Secret NOTEBOOKLM_STORAGE_STATE is empty or not configured in GitHub Secrets!"
            exit 1
          fi

          mkdir -p ~/.notebooklm/profiles/default
          printf '%s\n' "$NOTEBOOKLM_STORAGE_STATE" > ~/.notebooklm/profiles/default/storage_state.json
          chmod 600 ~/.notebooklm/profiles/default/storage_state.json

          # Validate JSON structure
          python3 -c "
          import json, sys
          try:
              with open(sys.argv[1]) as f:
                  data = json.load(f)
              if not isinstance(data, dict):
                  raise ValueError('Root is not a JSON object')
              print('Auth profile JSON format verified.')
          except Exception as e:
              print(f'::error::NOTEBOOKLM_STORAGE_STATE is not valid JSON ({e})! NotebookLM requires the full contents of ~/.notebooklm/profiles/default/storage_state.json (run: pbcopy < ~/.notebooklm/profiles/default/storage_state.json and paste into GitHub Secrets).')
              sys.exit(1)
          " ~/.notebooklm/profiles/default/storage_state.json

      - name: Verify NotebookLM Auth & CLI
        run: |
          notebooklm --version
          notebooklm list || echo "::warning::notebooklm list returned non-zero or empty list."

      - name: Run Course Content Ingestion
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.sync_all }}" = "true" ]; then
            echo "Running full repository synchronization..."
            python3 scripts/sync_to_notebook.py --all
          else
            echo "Running delta sync based on Git changes..."
            python3 scripts/sync_to_notebook.py
          fi

      - name: Persist and Commit Updated notebooks.json
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain notebooks.json)" ]; then
            echo "notebooks.json updated. Committing changes..."
            git add notebooks.json
            git commit -m "chore(sync): update notebooks.json mapping [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "notebooks.json is unchanged. Nothing to commit."
          fi
